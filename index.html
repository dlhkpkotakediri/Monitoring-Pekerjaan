<style>
  .loader {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #12372A;
    transition: opacity 0.4s ease,
                visibility 0.4s ease;
  }

  .loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-card {
    width: 100%;
    max-width: 320px;
    min-height: 96px;

    display: flex;
    align-items: center;
    gap: 14px;

    padding: 18px 20px;

    background: #142D22;
    border: 1px solid #405B4B;
    border-radius: 16px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    flex-shrink: 0;

    border: 3px solid #00A878;
    border-top-color: transparent;
    border-radius: 50%;

    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .loader-text {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .loader-title {
    margin: 0;
    color: #F4F4DC;
    font-size: 14px;
    font-weight: 700;
  }

  .loader-description {
    margin: 0;
    color: #AAB8B0;
    font-size: 12px;
    line-height: 1.5;
  }
</style>

<div class="loader" id="loader">
  <div class="loader-card">
    <div class="spinner"></div>

    <div class="loader-text">
      <p class="loader-title">Memuat aplikasi...</p>
      <p class="loader-description">
        Mohon tunggu, aplikasi sedang disiapkan.
      </p>
    </div>
  </div>
</div>
