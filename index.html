<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Pekerjaan DLHKP Kota Kediri</title>
  <link rel="icon" href="https://drive.google.com/file/d/1leKayvuWI8R5Uh1c78IH-wu-2yqss4Ai/view?usp=sharing" type="image/x-icon">
  <style>
    html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
  }
  .iframe-container {
    position: relative;
    width: 100%;
    /* Gunakan 100dvh agar responsif terhadap address bar HP */
    height: 100dvh; 
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    /* Tambahkan display block untuk menghilangkan celah kosong di bawah iframe */
    display: block; 
  }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #666;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div class="loader" id="loader">Memuat Aplikasi...</div>
    <iframe 
      src="https://script.google.com/macros/s/............/exec" 
      title="Monitoring Pekerjaan DLHKP Kota Kediri"
      onload="document.getElementById('loader').style.display='none';"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
